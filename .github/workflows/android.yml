name: Build Android APK (User)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      # خطوة إصلاح appId
      - name: Ensure Capacitor App ID
        run: |
          APP_ID="${{ secrets.USER_APP_ID }}"
          if [ -z "$APP_ID" ]; then
            echo "Error: USER_APP_ID secret is not set."
            exit 1
          fi
          # إنشاء ملف capacitor.config.json إذا لم يكن موجوداً
          if [ ! -f capacitor.config.json ]; then
            echo "{\"appId\": \"$APP_ID\"}" > capacitor.config.json
          else
            # استبدال appId الموجود
            sed -i "s/\"appId\": \"[^\"]*\"/\"appId\": \"$APP_ID\"/" capacitor.config.json
          fi

      # ✅ تم التعديل هنا: إزالة add android واستخدام sync فقط
      - name: Sync Android platform
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: user-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
