name: Build Android APK (User)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      # الخطوة المُصححة: تغيير معرف التطبيق
      - name: Set User App ID
        run: |
          # التحقق من وجود الملف وتعديله
          if [ -f "capacitor.config.json" ]; then
            sed -i 's/"appId": "[^"]*"/"appId": "${{ secrets.USER_APP_ID }}"/' capacitor.config.json
          elif [ -f "capacitor.config.ts" ]; then
            sed -i "s/appId: '[^']*'/appId: '${{ secrets.USER_APP_ID }}'/" capacitor.config.ts
          else
            echo "Warning: capacitor.config file not found!"
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: user-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
